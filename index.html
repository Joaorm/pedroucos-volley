<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Presenças · Voleibol CSP</title>
<meta name="description" content="Presenças nos treinos de voleibol do Clube Sportivo de Pedrouços.">
<link rel="icon" href="logo-180.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><img src="logo-180.png" alt="Clube Sportivo de Pedrouços" width="44" height="44"><span>Voleibol</span></div>
    <nav class="nav" aria-label="Secções">
      <a href="./" aria-current="page">Presenças</a>
      <a href="jogos">Jogos</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <p id="alert" class="notice" role="status" aria-live="polite" hidden></p>
  <div id="sessions" aria-busy="true">
    <div class="skeleton" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"><i></i><i></i><i></i></i></div>
  </div>
  <datalist id="nomes"></datalist>
</main>

<p id="toast" class="toast" role="alert" hidden></p>
<p id="sr" class="sr-only" aria-live="polite"></p>

<footer class="foot">Pedidos de alteração: <a id="contactLink" href="mailto:einstein.rochaemelo+volley@mail.grokbot.com">einstein.rochaemelo+volley@<wbr>mail.grokbot.com</a></footer>

<template id="choicesTpl">
  <div class="choices" role="group">
    <button type="button" class="choice" data-status="vou" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span>Vou</span>
    </button>
    <button type="button" class="choice" data-status="nao" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      <span>Não vou</span>
    </button>
    <button type="button" class="choice" data-status="talvez" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.8 9.2a3.2 3.2 0 1 1 4.5 2.9c-.8.4-1.3 1.1-1.3 2v.6"/><path d="M12 18.6h.01"/></svg>
      <span>Talvez</span>
    </button>
  </div>
</template>

<script type="module">
import { STATUS_LABELS, addDays, cleanName, formatSession, lisbonToday, nextTrainings, normalizeName } from "./schedule.js";

const STORAGE_KEY = "csp-volley-nome";
const ORDER = ["vou", "nao", "talvez"];
const GROUP_LABELS = { vou: "Vão", nao: "Não vão", talvez: "Talvez" };
const TALLY_LABELS = { vou: "vão", nao: "não vão", talvez: "talvez" };
const EXPECT_MS = 120000;
const UNAVAILABLE = "As presenças ainda não estão disponíveis.";
const LOAD_FAIL = "Não foi possível carregar as presenças.";
const SAVE_FAIL = "Não foi possível guardar.";

const state = {
  name: storedName(),
  editing: false,
  signature: "",
  dates: [],
  sessions: new Map(), // confirmado pelo servidor
  pending: new Map(),  // resposta mostrada já, enquanto se guarda
  queued: new Map(),   // resposta a enviar quando a anterior terminar
  inflight: new Set(),
  expected: new Map(), // evita que uma leitura atrasada desfaça a resposta acabada de dar
  unconfigured: false,
};
let alertKind = "";
let toastTimer = 0;

const $ = (id) => document.getElementById(id);
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* ---------- Nome guardado no telemóvel ---------- */

function storedName() {
  try { return cleanName(localStorage.getItem(STORAGE_KEY) || "") || ""; }
  catch { return ""; }
}

function remember(name) {
  state.name = name;
  state.editing = false;
  try { localStorage.setItem(STORAGE_KEY, name); } catch { /* modo privado */ }
  hideToast();
  paintWho();
  paintAll();
}

function paintWho() {
  const slot = $("who");
  if (!slot) return;
  slot.replaceChildren();
  if (state.name && !state.editing) {
    const line = el("p", "who-line");
    const change = el("button", "link-btn", "Alterar");
    change.type = "button";
    change.setAttribute("aria-label", "Alterar nome");
    change.addEventListener("click", () => {
      state.editing = true;
      paintWho();
      const input = $("nome");
      input.focus();
      input.select();
    });
    line.append(el("strong", "", state.name), change);
    slot.appendChild(line);
    return;
  }
  const form = el("form", "who-form");
  const label = el("label", "sr-only", "O teu nome");
  label.htmlFor = "nome";
  const input = el("input", "name-input");
  Object.assign(input, { id: "nome", placeholder: "O teu nome", maxLength: 40, autocomplete: "name", enterKeyHint: "done", required: true });
  input.setAttribute("autocapitalize", "words");
  input.setAttribute("list", "nomes");
  if (state.editing) input.value = state.name;
  input.addEventListener("input", () => input.removeAttribute("aria-invalid"));
  input.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state.editing) {
      state.editing = false;
      paintWho();
    }
  });
  input.addEventListener("blur", () => commitName(input, false));
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    if (commitName(input, true)) input.blur();
  });
  form.append(label, input);
  slot.appendChild(form);
}

function commitName(input, strict) {
  if (!input.isConnected) return Boolean(state.name);
  const raw = input.value;
  const cleaned = cleanName(raw);
  if (cleaned) {
    if (cleaned !== state.name || state.editing) remember(cleaned);
    return true;
  }
  if (!raw.trim() && state.editing) {
    state.editing = false;
    paintWho();
    return true;
  }
  if (strict || raw.trim()) {
    input.setAttribute("aria-invalid", "true");
    showToast(raw.trim() ? "Nome inválido." : "Escreve o teu nome.");
  }
  return false;
}

/* ---------- Mensagens ---------- */

function setAlert(message, kind) {
  alertKind = kind;
  const box = $("alert");
  box.className = kind === "storage" ? "notice" : "notice notice--error";
  box.textContent = message;
  box.hidden = false;
}

function clearAlert(kind) {
  if (kind && alertKind !== kind) return;
  alertKind = "";
  const box = $("alert");
  box.hidden = true;
  box.textContent = "";
}

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 4500);
}

function hideToast() {
  clearTimeout(toastTimer);
  $("toast").hidden = true;
}

function announce(message) {
  const sr = $("sr");
  sr.textContent = "";
  requestAnimationFrame(() => { sr.textContent = message; });
}

function messageFrom(data, fallback) {
  const message = typeof data?.error === "string" ? data.error.trim() : "";
  if (message && message.length <= 140 && !message.includes("<")) return message;
  return fallback;
}

function setContact(address) {
  const link = $("contactLink");
  link.href = `mailto:${address}`;
  const at = address.lastIndexOf("@");
  link.replaceChildren();
  if (at > 0) link.append(address.slice(0, at + 1), document.createElement("wbr"), address.slice(at + 1));
  else link.textContent = address;
}

/* ---------- Estado mostrado ---------- */

function withVote(base, name, status) {
  const key = normalizeName(name);
  const people = (base?.people || []).filter((person) => normalizeName(person.name) !== key);
  people.push({ name, status });
  people.sort((a, b) => a.name.localeCompare(b.name, "pt"));
  const counts = { vou: 0, nao: 0, talvez: 0 };
  for (const person of people) if (counts[person.status] !== undefined) counts[person.status] += 1;
  return { date: base?.date, counts, people };
}

function view(date) {
  const base = state.sessions.get(date);
  const pending = state.pending.get(date);
  return pending && state.name ? withVote(base, state.name, pending) : base;
}

function myStatus(date) {
  if (!state.name) return "";
  const pending = state.pending.get(date);
  if (pending) return pending;
  const key = normalizeName(state.name);
  return state.sessions.get(date)?.people?.find((person) => normalizeName(person.name) === key)?.status || "";
}

/* ---------- Desenho ---------- */

function eyebrowFor(date, today, index) {
  if (date === today) return "Hoje";
  if (date === addDays(today, 1)) return "Amanhã";
  return index === 0 ? "Próximo treino" : "Treino seguinte";
}

function paintShell(dates, today) {
  const root = $("sessions");
  root.replaceChildren();
  root.removeAttribute("aria-busy");
  if (!dates.length) {
    root.appendChild(el("p", "empty", "Sem treinos marcados."));
    return;
  }
  const template = $("choicesTpl");
  dates.forEach((date, index) => {
    const section = el("section", `session ${index === 0 ? "session--next" : "session--later"}`);
    section.dataset.date = date;
    const heading = el(index === 0 ? "h1" : "h2", "date");
    heading.id = `t-${date}`;
    const [dow, dm] = formatSession(date).split(" ");
    heading.append(el("span", "dow", dow), dm);
    section.setAttribute("aria-labelledby", heading.id);
    section.append(el("p", "eyebrow", eyebrowFor(date, today, index)), heading);
    if (index === 0) {
      const who = el("div", "who");
      who.id = "who";
      section.appendChild(who);
    }
    const choices = template.content.firstElementChild.cloneNode(true);
    choices.setAttribute("aria-label", `Resposta para ${formatSession(date)}`);
    for (const button of choices.querySelectorAll(".choice")) {
      button.addEventListener("click", () => vote(date, button.dataset.status));
    }
    section.append(choices, el("div", "tally"), el("div", "roster"));
    root.appendChild(section);
  });
  paintWho();
  paintAll();
}

function paintAll() {
  for (const date of state.dates) paintSession(date);
}

function paintSession(date) {
  const section = document.querySelector(`section[data-date="${date}"]`);
  if (!section) return;
  const data = view(date);
  const mine = state.name ? normalizeName(state.name) : "";
  const status = myStatus(date);
  $("sessions").classList.toggle("unavailable", state.unconfigured);

  const choices = section.querySelector(".choices");
  choices.classList.toggle("chosen", Boolean(status));
  for (const button of choices.querySelectorAll(".choice")) {
    const on = button.dataset.status === status;
    button.setAttribute("aria-pressed", on ? "true" : "false");
    button.disabled = state.unconfigured;
    if (on && state.inflight.has(date)) button.setAttribute("aria-busy", "true");
    else button.removeAttribute("aria-busy");
  }

  const tally = section.querySelector(".tally");
  tally.replaceChildren();
  for (const key of ORDER) {
    const cell = el("div", key);
    cell.append(el("b", "", data ? String(data.counts?.[key] ?? 0) : "–"), el("span", "", TALLY_LABELS[key]));
    tally.appendChild(cell);
  }

  const roster = section.querySelector(".roster");
  roster.replaceChildren();
  if (!data) return;
  for (const key of ORDER) {
    const people = (data.people || []).filter((person) => person.status === key);
    if (!people.length) continue;
    const group = el("div", `group group--${key}`);
    const list = el("ul", "names");
    for (const person of people) {
      const item = el("li", mine && normalizeName(person.name) === mine ? "me" : "", person.name);
      list.appendChild(item);
    }
    group.append(el("h3", "", GROUP_LABELS[key]), list);
    roster.appendChild(group);
  }
}

function syncNames() {
  const names = new Set();
  for (const session of state.sessions.values()) {
    for (const person of session.people || []) names.add(person.name);
  }
  const list = $("nomes");
  list.replaceChildren();
  for (const name of [...names].sort((a, b) => a.localeCompare(b, "pt"))) {
    const option = document.createElement("option");
    option.value = name;
    list.appendChild(option);
  }
}

/* ---------- Respostas ---------- */

function vote(date, status) {
  if (state.unconfigured) return;
  const input = $("nome");
  if (input) {
    const raw = input.value;
    const cleaned = cleanName(raw);
    if (cleaned) {
      if (cleaned !== state.name || state.editing) remember(cleaned);
    } else if (raw.trim() || !state.name) {
      input.setAttribute("aria-invalid", "true");
      showToast(raw.trim() ? "Nome inválido." : "Escreve o teu nome.");
      input.focus();
      return;
    } else {
      state.editing = false;
      paintWho();
    }
  }
  const name = state.name;
  if (!name) return;
  hideToast();
  if (myStatus(date) === status && !state.inflight.has(date)) {
    announce(`${STATUS_LABELS[status]} · ${formatSession(date)}`);
    return;
  }
  state.pending.set(date, status);
  try { navigator.vibrate?.(12); } catch { /* sem vibração */ }
  if (state.inflight.has(date)) {
    state.queued.set(date, { name, status });
    paintSession(date);
    return;
  }
  send(date, name, status);
}

async function send(date, name, status) {
  state.inflight.add(date);
  paintSession(date);
  let saved = false;
  try {
    const response = await fetch("/api/presencas", {
      method: "POST",
      headers: { "content-type": "application/json" },
      cache: "no-store",
      body: JSON.stringify({ date, name, status }),
    });
    const data = await response.json().catch(() => ({}));
    if (response.status === 503 && data.code === "storage_unconfigured") {
      state.unconfigured = true;
      setAlert(messageFrom(data, UNAVAILABLE), "storage");
    } else if (!response.ok) {
      showToast(messageFrom(data, SAVE_FAIL));
    } else {
      saved = true;
      state.unconfigured = false;
      state.sessions.set(date, data);
      state.expected.set(date, { name: normalizeName(name), status, until: Date.now() + EXPECT_MS });
      syncNames();
    }
  } catch {
    showToast(SAVE_FAIL);
  } finally {
    state.inflight.delete(date);
    const next = state.queued.get(date);
    state.queued.delete(date);
    if (next && !state.unconfigured) {
      send(date, next.name, next.status);
    } else {
      state.pending.delete(date);
      paintSession(date);
      if (saved) announce(`${STATUS_LABELS[status]} · ${formatSession(date)} · guardado`);
    }
  }
}

/* ---------- Leitura ---------- */

async function loadDate(date) {
  const response = await fetch(`/api/presencas?date=${encodeURIComponent(date)}`, { cache: "no-store" });
  const data = await response.json().catch(() => ({}));
  if (response.status === 503 && data.code === "storage_unconfigured") {
    state.unconfigured = true;
    setAlert(messageFrom(data, UNAVAILABLE), "storage");
    paintSession(date);
    return;
  }
  if (!response.ok) throw new Error("load");
  const expected = state.expected.get(date);
  if (expected) {
    const mine = (data.people || []).find((person) => normalizeName(person.name) === expected.name);
    const caughtUp = mine && mine.status === expected.status;
    if (!caughtUp && Date.now() < expected.until) return;
    state.expected.delete(date);
  }
  state.unconfigured = false;
  if (alertKind === "storage" || alertKind === "load") clearAlert(alertKind);
  state.sessions.set(date, data);
  paintSession(date);
  syncNames();
}

async function refresh() {
  const dates = state.dates.filter((date) => !state.inflight.has(date));
  const results = await Promise.allSettled(dates.map((date) => loadDate(date)));
  if (dates.length && results.every((result) => result.status === "rejected")) setAlert(LOAD_FAIL, "load");
}

async function boot() {
  const response = await fetch("data.json", { cache: "no-store" });
  if (!response.ok) throw new Error("data");
  const data = await response.json();
  const contact = data?.equipa?.contacto_alteracoes;
  if (typeof contact === "string" && contact.includes("@")) setContact(contact);
  const today = lisbonToday();
  const dates = nextTrainings(data, today, 2);
  const signature = `${today}|${dates.join()}`;
  if (signature !== state.signature) {
    const editingValue = $("nome")?.value;
    state.signature = signature;
    state.dates = dates;
    for (const key of [...state.sessions.keys()]) if (!dates.includes(key)) state.sessions.delete(key);
    paintShell(dates, today);
    if (editingValue && $("nome")) $("nome").value = editingValue;
    if (dates[0]) document.title = `${formatSession(dates[0])} · Voleibol CSP`;
  }
  if (dates.length) await refresh();
}

function run() {
  boot().catch(() => {
    if (!state.signature) $("sessions").replaceChildren();
    setAlert(LOAD_FAIL, "load");
  });
}

run();
setInterval(() => {
  if (!document.hidden && !state.inflight.size) run();
}, 5000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !state.inflight.size) run();
});
</script>
</body>
</html>
