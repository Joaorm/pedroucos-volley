<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Presenças · Voleibol CSP</title>
<meta name="description" content="Presenças nos treinos de voleibol do Clube Sportivo de Pedrouços.">
<link rel="icon" href="logo-180.png">
<link rel="apple-touch-icon" href="logo-180.png">
<style>
  :root{--bg:#111111;--card:#1b1b1b;--line:#2c2c2c;--gold:#FFD700;--white:#ffffff;--muted:#b8b8b8;--red:#E63946}
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--white);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--gold)}
  header.top{position:relative;text-align:center;padding:16px 16px 14px;border-bottom:3px solid var(--gold);background:radial-gradient(circle at 50% 0,#262200 0,var(--bg) 72%)}
  header.top img{width:76px;height:76px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 6px 24px rgba(255,215,0,.18)}
  a.nav{position:absolute;top:8px;right:6px;min-height:44px;display:inline-flex;align-items:center;padding:8px 10px;font-weight:700;text-decoration:none}
  main{max-width:760px;margin:0 auto;padding:14px 14px 8px}
  #alert:not([hidden]){background:var(--red);color:#fff;padding:12px;border-radius:10px;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;margin-bottom:12px}
  .when{margin:0 0 10px;text-align:center;color:var(--gold);font-weight:800;letter-spacing:.01em}
  h1.when{font-size:2.15rem}
  h2.when{font-size:1.55rem}
  .me{text-align:center;margin:0 0 10px;font-weight:700}
  .alterar{background:none;border:0;color:var(--gold);font:inherit;font-size:.85rem;font-weight:700;margin-left:8px;min-height:44px;padding:8px;cursor:pointer}
  .nome{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid #555;background:#111;color:#fff;margin:0 0 10px}
  .nome:focus{outline:2px solid var(--gold);border-color:transparent}
  .nome[aria-invalid="true"]{border-color:var(--red)}
  .actions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
  .actions button{font:inherit;font-weight:800;font-size:.92rem;min-height:48px;border-radius:12px;border:1px solid #666;background:transparent;color:#fff;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .actions button:focus-visible,.alterar:focus-visible,a.nav:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .actions button[aria-pressed="true"][data-status="vou"]{background:var(--gold);color:#111;border-color:var(--gold)}
  .actions button[aria-pressed="true"][data-status="nao"]{background:var(--red);color:#fff;border-color:var(--red)}
  .actions button[aria-pressed="true"][data-status="talvez"]{background:#fff;color:#111;border-color:#fff}
  .actions button:disabled{opacity:.45}
  .zero{color:var(--muted);text-align:center;margin:12px 0 0}
  .group{margin-top:12px}
  .group h2{margin:0;font-size:.95rem;font-weight:800;color:var(--gold)}
  .group.nao h2{color:#fff}
  .group.talvez h2{color:var(--muted)}
  .group ul{list-style:none;margin:0;padding:0}
  .group li{padding:7px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
  footer{border-top:3px solid var(--gold);text-align:center;padding:18px 14px calc(28px + env(safe-area-inset-bottom));color:var(--muted);font-size:.88rem;margin-top:8px}
  footer a{overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="top">
  <a class="nav" href="jogos">Jogos</a>
  <img src="logo-180.png" alt="Logótipo do Clube Sportivo de Pedrouços" width="76" height="76">
</header>
<main>
  <p id="alert" hidden></p>
  <div id="sessions"></div>
  <datalist id="nomes"></datalist>
</main>
<footer>
  <div>Pedidos de alteração: <a id="contactLink" href="mailto:einstein.rochaemelo+volley@mail.grokbot.com">einstein.rochaemelo+volley@<wbr>mail.grokbot.com</a></div>
  <div style="margin-top:6px">Clube Sportivo de Pedrouços · Voleibol</div>
</footer>
<script type="module">
import { STATUS_LABELS, cleanName, formatSession, lisbonToday, nextTrainings, normalizeName } from "./schedule.js";

const STORAGE_KEY = "csp-volley-nome";
const state = { name: storedName(), dates: [], signature: "", sessions: new Map(), saving: new Set(), expected: new Map(), unconfigured: false };
let errorKind = "";

function setContact(address) {
  const link = document.getElementById("contactLink");
  link.href = `mailto:${address}`;
  const at = address.lastIndexOf("@");
  link.replaceChildren();
  if (at > 0) link.append(address.slice(0, at + 1), document.createElement("wbr"), address.slice(at + 1));
  else link.textContent = address;
}

function storedName() {
  try { return cleanName(localStorage.getItem(STORAGE_KEY) || "") || ""; }
  catch { return ""; }
}

function showError(message, kind) {
  errorKind = kind;
  const alert = document.getElementById("alert");
  alert.hidden = false;
  alert.textContent = message;
}

function clearError(kind) {
  if (kind && errorKind !== kind) return;
  errorKind = "";
  const alert = document.getElementById("alert");
  alert.hidden = true;
  alert.textContent = "";
}

function remember(name) {
  state.name = name;
  try { localStorage.setItem(STORAGE_KEY, name); } catch { /* modo privado */ }
  const input = document.getElementById("nome");
  if (input) input.removeAttribute("aria-invalid");
  paintName();
  paintPressed();
}

function paintName() {
  const slot = document.getElementById("nameSlot");
  if (!slot) return;
  slot.replaceChildren();
  if (state.name) {
    const line = document.createElement("p");
    line.className = "me";
    const who = document.createElement("span");
    who.textContent = state.name;
    const change = document.createElement("button");
    change.type = "button";
    change.className = "alterar";
    change.textContent = "alterar";
    change.addEventListener("click", () => {
      const previous = state.name;
      state.name = "";
      try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
      paintName();
      paintPressed();
      const input = document.getElementById("nome");
      if (input) {
        input.value = previous;
        input.focus();
        input.select();
      }
    });
    line.append(who, change);
    slot.appendChild(line);
    return;
  }
  const form = document.createElement("form");
  const input = document.createElement("input");
  input.id = "nome";
  input.className = "nome";
  input.placeholder = "Nome";
  input.maxLength = 40;
  input.autocomplete = "name";
  input.enterKeyHint = "done";
  input.setAttribute("list", "nomes");
  input.required = true;
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const cleaned = cleanName(input.value);
    if (!cleaned) {
      input.setAttribute("aria-invalid", "true");
      showError("Nome inválido.", "save");
      input.focus();
      return;
    }
    clearError("save");
    remember(cleaned);
  });
  form.appendChild(input);
  slot.appendChild(form);
}

function paintShell(dates) {
  const root = document.getElementById("sessions");
  root.replaceChildren();
  if (!dates.length) {
    const empty = document.createElement("p");
    empty.className = "zero";
    empty.textContent = "Sem treinos.";
    root.appendChild(empty);
    return;
  }
  dates.forEach((date, index) => {
    const article = document.createElement("article");
    article.className = "card";
    article.dataset.date = date;
    const title = document.createElement(index === 0 ? "h1" : "h2");
    title.className = "when";
    title.textContent = formatSession(date);
    article.appendChild(title);
    if (index === 0) {
      const slot = document.createElement("div");
      slot.id = "nameSlot";
      article.appendChild(slot);
    }
    const actions = document.createElement("div");
    actions.className = "actions";
    for (const status of ["vou", "nao", "talvez"]) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.status = status;
      button.textContent = STATUS_LABELS[status];
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => vote(date, status));
      actions.appendChild(button);
    }
    const lists = document.createElement("div");
    lists.className = "lists";
    article.append(actions, lists);
    root.appendChild(article);
  });
  paintName();
  for (const date of dates) paintLists(date);
  paintPressed();
}

function paintLists(date) {
  const article = document.querySelector(`article[data-date="${date}"]`);
  const lists = article?.querySelector(".lists");
  if (!lists) return;
  const session = state.sessions.get(date);
  lists.replaceChildren();
  if (!session) return;
  const groups = ["vou", "nao", "talvez"].filter((status) => session.counts[status] > 0);
  if (!groups.length) {
    const zero = document.createElement("p");
    zero.className = "zero";
    zero.textContent = "Vou 0 · Não vou 0";
    lists.appendChild(zero);
    return;
  }
  for (const status of groups) {
    const group = document.createElement("div");
    group.className = `group ${status}`;
    const heading = document.createElement("h2");
    heading.textContent = `${STATUS_LABELS[status]} ${session.counts[status]}`;
    const ul = document.createElement("ul");
    for (const person of session.people.filter((item) => item.status === status)) {
      const li = document.createElement("li");
      li.textContent = person.name;
      ul.appendChild(li);
    }
    group.append(heading, ul);
    lists.appendChild(group);
  }
}

function paintPressed() {
  const mine = state.name ? normalizeName(state.name) : "";
  for (const article of document.querySelectorAll("article[data-date]")) {
    const session = state.sessions.get(article.dataset.date);
    const mineStatus = mine && session ? session.people.find((person) => normalizeName(person.name) === mine)?.status : "";
    for (const button of article.querySelectorAll("button[data-status]")) {
      button.setAttribute("aria-pressed", mineStatus === button.dataset.status ? "true" : "false");
      button.disabled = state.unconfigured || state.saving.has(article.dataset.date);
    }
  }
}

function syncNames() {
  const names = new Set();
  for (const session of state.sessions.values()) {
    for (const person of session.people || []) names.add(person.name);
  }
  const list = document.getElementById("nomes");
  list.replaceChildren();
  for (const name of [...names].sort((a, b) => a.localeCompare(b, "pt"))) {
    const option = document.createElement("option");
    option.value = name;
    list.appendChild(option);
  }
}

function messageFrom(data, fallback) {
  const message = typeof data?.error === "string" ? data.error.trim() : "";
  if (message && message.length <= 140 && !message.includes("<")) return message;
  return fallback;
}

async function loadDate(date) {
  const response = await fetch(`/api/presencas?date=${encodeURIComponent(date)}`, { cache: "no-store" });
  const data = await response.json().catch(() => ({}));
  if (response.status === 503 && data.code === "storage_unconfigured") {
    state.unconfigured = true;
    showError(messageFrom(data, "As presenças ainda não estão disponíveis."), "storage");
    paintPressed();
    return;
  }
  if (!response.ok) throw new Error("load");
  const expected = state.expected.get(date);
  if (expected) {
    const mine = (data.people || []).find((person) => normalizeName(person.name) === expected.name);
    if (!mine || mine.status !== expected.status) return;
    state.expected.delete(date);
  }
  state.unconfigured = false;
  if (errorKind === "storage" || errorKind === "load") clearError(errorKind);
  state.sessions.set(date, data);
  paintLists(date);
  paintPressed();
  syncNames();
}

async function refresh() {
  const results = await Promise.allSettled(state.dates.map((date) => loadDate(date)));
  if (state.dates.length && results.every((result) => result.status === "rejected")) {
    showError("Não foi possível carregar as presenças.", "load");
  }
}

async function vote(date, status) {
  const raw = state.name || document.getElementById("nome")?.value || "";
  const name = cleanName(raw);
  if (!name) {
    const input = document.getElementById("nome");
    if (raw.trim()) {
      input?.setAttribute("aria-invalid", "true");
      showError("Nome inválido.", "save");
    }
    input?.focus();
    return;
  }
  remember(name);
  state.saving.add(date);
  paintPressed();
  try {
    const response = await fetch("/api/presencas", {
      method: "POST",
      headers: { "content-type": "application/json" },
      cache: "no-store",
      body: JSON.stringify({ date, name, status }),
    });
    const data = await response.json().catch(() => ({}));
    if (response.status === 503 && data.code === "storage_unconfigured") {
      state.unconfigured = true;
      showError(messageFrom(data, "As presenças ainda não estão disponíveis."), "storage");
      return;
    }
    if (!response.ok) {
      showError(messageFrom(data, "Não foi possível guardar."), "save");
      return;
    }
    clearError("save");
    state.unconfigured = false;
    state.expected.set(date, { name: normalizeName(name), status });
    state.sessions.set(date, data);
    paintLists(date);
    syncNames();
  } catch {
    showError("Não foi possível guardar.", "save");
  } finally {
    state.saving.delete(date);
    paintPressed();
  }
}

async function boot() {
  const response = await fetch("data.json", { cache: "no-store" });
  if (!response.ok) throw new Error("data");
  const data = await response.json();
  const contact = data?.equipa?.contacto_alteracoes;
  if (contact) setContact(contact);
  const dates = nextTrainings(data, lisbonToday(), 2);
  const signature = dates.join();
  if (signature !== state.signature) {
    state.signature = signature;
    state.dates = dates;
    state.sessions.clear();
    paintShell(dates);
    if (dates[0]) document.title = `${formatSession(dates[0])} · Voleibol CSP`;
  }
  if (dates.length) await refresh();
}

boot().catch(() => showError("Não foi possível carregar as presenças.", "load"));
setInterval(() => {
  if (document.hidden || state.saving.size) return;
  boot().catch(() => showError("Não foi possível carregar as presenças.", "load"));
}, 5000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !state.saving.size) boot().catch(() => showError("Não foi possível carregar as presenças.", "load"));
});
</script>
</body>
</html>
