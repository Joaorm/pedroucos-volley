<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Jogos · Voleibol CSP</title>
<meta name="description" content="Resultados e próximos jogos da equipa de voleibol do Clube Sportivo de Pedrouços.">
<link rel="icon" href="logo-180.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><img src="logo-180.png" alt="Clube Sportivo de Pedrouços" width="44" height="44"><span>Voleibol</span></div>
    <nav class="nav" aria-label="Secções">
      <a href="./">Presenças</a>
      <a href="jogos" aria-current="page">Jogos</a>
    </nav>
  </div>
</header>

<main class="wrap wrap--wide">
  <div class="page-head">
    <h1>Jogos</h1>
    <p class="page-sub" id="comp"></p>
  </div>
  <p id="alert" class="notice notice--error" role="alert" hidden></p>
  <section class="block" aria-labelledby="h-proximos">
    <h2 class="block-title" id="h-proximos">Próximos jogos</h2>
    <div id="jogosList"></div>
  </section>
  <section class="block" aria-labelledby="h-resultados">
    <h2 class="block-title" id="h-resultados">Resultados</h2>
    <div id="resultadosList"></div>
  </section>
</main>

<footer class="foot">Pedidos de alteração: <a id="contactLink" href="mailto:einstein.rochaemelo+volley@mail.grokbot.com">einstein.rochaemelo+volley@<wbr>mail.grokbot.com</a></footer>

<script type="module">
import { addDays, formatSession, isIsoDate, lisbonToday } from "./schedule.js";

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';

function safeUrl(value) {
  if (typeof value !== "string" || !value) return "";
  try {
    const url = new URL(value);
    return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
  } catch { return ""; }
}

function videoLink(value, opponent) {
  const url = safeUrl(value);
  if (!url) return "";
  const label = opponent ? `Vídeo do jogo com ${opponent}` : "Vídeo do jogo";
  return `<a class="video" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(label)}">${PLAY}<span>Vídeo</span></a>`;
}

// "Liga … · 1ª fase · Série C · Jogo 53" → { prefix: "Liga … · 1ª fase · Série C", game: "Jogo 53" }
function splitComp(value) {
  if (typeof value !== "string" || !value.trim()) return { prefix: "", game: "" };
  const parts = value.split("·").map((part) => part.trim()).filter(Boolean);
  const game = parts.length && /^jogo\b/i.test(parts[parts.length - 1]) ? parts.pop() : "";
  return { prefix: parts.join(" · "), game };
}

function when(iso, time) {
  const [dow, dm] = isIsoDate(iso) ? formatSession(iso).split(" ") : ["", "–"];
  const clock = time === undefined ? "" : `<span class="time">${esc(time || "--:--")}</span>`;
  return `<div class="game-when"><span class="dow">${esc(dow)}</span><span class="dm">${esc(dm)}</span>${clock}</div>`;
}

function tags(game, comp) {
  const out = [];
  if (game.casa === true) out.push('<span class="tag tag--casa">Casa</span>');
  if (game.casa === false) out.push('<span class="tag">Fora</span>');
  if (game.exemplo) out.push('<span class="tag tag--muted">Exemplo</span>');
  if (comp.game) out.push(`<span class="tag tag--muted">${esc(comp.game)}</span>`);
  return out.length ? `<div class="tags">${out.join("")}</div>` : "";
}

function opponent(game, fallback) {
  return `<h3 class="opp"><span class="vs">vs</span> ${esc(game.adversario || fallback)}</h3>`;
}

function upcomingCard(game, index, today, shared) {
  const comp = splitComp(game.competicao);
  let eyebrow = "";
  if (index === 0) {
    const label = game.data === today ? "Hoje" : game.data === addDays(today, 1) ? "Amanhã" : "Próximo jogo";
    eyebrow = `<p class="eyebrow">${label}</p>`;
  }
  return `<article class="game${index === 0 ? " game--next" : ""}">
    ${eyebrow}
    ${when(game.data, game.hora || "")}
    <div class="game-body">
      ${tags(game, comp)}
      ${opponent(game, "Adversário a definir")}
      <p class="venue">${PIN}<span>${esc(game.local || "Local a definir")}</span></p>
      ${!shared && comp.prefix ? `<p class="comp">${esc(comp.prefix)}</p>` : ""}
      ${videoLink(game.video, game.adversario)}
    </div>
  </article>`;
}

function resultCard(game, shared) {
  const comp = splitComp(game.competicao);
  const sets = (Array.isArray(game.sets) ? game.sets : [])
    .map((set) => String(set).split("-").map(Number))
    .filter(([a, b]) => Number.isFinite(a) && Number.isFinite(b));
  let score = "";
  let detail;
  if (sets.length) {
    const nos = sets.filter(([a, b]) => a > b).length;
    const eles = sets.filter(([a, b]) => b > a).length;
    const outcome = nos > eles ? "win" : eles > nos ? "loss" : "";
    const label = outcome === "win" ? "Vitória" : outcome === "loss" ? "Derrota" : "";
    score = `<div class="score ${outcome}"><b>${nos}–${eles}</b>${label ? `<span>${label}</span>` : ""}</div>`;
    detail = `<div class="sets"><span class="sr-only">Parciais:</span>${sets.map(([a, b]) => `<span${a > b ? ' class="won"' : ""}>${a}–${b}</span>`).join("")}</div>`;
  } else {
    detail = `<p class="pending">${game.resultado ? esc(game.resultado) : "Resultado por confirmar"}</p>`;
  }
  return `<article class="game game--result">
    ${when(game.data)}
    <div class="game-body">
      ${tags(game, comp)}
      ${opponent(game, "Adversário")}
      ${detail}
      ${!shared && comp.prefix ? `<p class="comp">${esc(comp.prefix)}</p>` : ""}
      ${videoLink(game.video, game.adversario)}
    </div>
    ${score}
  </article>`;
}

function setContact(address) {
  const link = document.getElementById("contactLink");
  link.href = `mailto:${address}`;
  const at = address.lastIndexOf("@");
  link.replaceChildren();
  if (at > 0) link.append(address.slice(0, at + 1), document.createElement("wbr"), address.slice(at + 1));
  else link.textContent = address;
}

function render(data) {
  const team = data.equipa || {};
  if (team.nome) document.title = `Jogos · ${team.nome}`;
  if (typeof team.contacto_alteracoes === "string" && team.contacto_alteracoes.includes("@")) setContact(team.contacto_alteracoes);

  const today = lisbonToday();
  const upcoming = (data.proximos_jogos || [])
    .filter((game) => String(game.data || "") >= today)
    .sort((a, b) => (a.data + (a.hora || "")).localeCompare(b.data + (b.hora || "")));
  const results = [...(data.resultados || [])].sort((a, b) => String(b.data).localeCompare(String(a.data)));

  const prefixes = new Set([...upcoming, ...results].map((game) => splitComp(game.competicao).prefix).filter(Boolean));
  const shared = prefixes.size === 1 && [...upcoming, ...results].every((game) => splitComp(game.competicao).prefix);
  document.getElementById("comp").textContent = shared ? [...prefixes][0] : "";

  document.getElementById("jogosList").innerHTML = upcoming.length
    ? upcoming.map((game, index) => upcomingCard(game, index, today, shared)).join("")
    : '<p class="empty">Sem jogos marcados.</p>';
  document.getElementById("resultadosList").innerHTML = results.length
    ? results.map((game) => resultCard(game, shared)).join("")
    : '<p class="empty">Ainda sem resultados.</p>';
}

fetch("data.json", { cache: "no-store" })
  .then((response) => { if (!response.ok) throw new Error(String(response.status)); return response.json(); })
  .then(render)
  .catch(() => {
    const alert = document.getElementById("alert");
    alert.textContent = "Não foi possível carregar os jogos. Tenta recarregar a página.";
    alert.hidden = false;
  });
</script>
</body>
</html>
